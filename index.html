<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#F7F7F5"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#232220"
      media="(prefers-color-scheme: dark)"
    />

    <script>
      // Before first paint, so a saved scheme doesn't open on the OS's for a frame.
      // See useColorScheme, which writes the same key.
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch {}
    </script>

    <meta
      name="description"
      content="Richard Han is a freelance Full Stack Developer based in Auckland, New Zealand."
    />

    <link
      rel="preload"
      href="/fonts/fjalla-one-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/urbanist-latin-500-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/urbanist-latin-600-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/epilogue-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/epilogue-latin-500-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <script>
      // Each page's opening pictures are only found once its chunk has mounted, so
      // they're named here, per path — every path serves this document, and a
      // preload for another page's pictures takes bandwidth from this one's.
      {
        const OPENING_SHOTS = [
          { href: "/images/projects/neatplaces.webp" },
          {
            href: "/images/projects/thakeham.webp",
            media: "(min-width: 768px)",
          },
          {
            href: "/images/projects/touchgrass.webp",
            media: "(min-width: 768px)",
          },
        ];
        // The homepage's are its ticker's, served at the ticker's sizes — the same
        // set as shots.data and the sizes HomeBlocks and HomeIntro give it, or the
        // preload is a second download rather than the first.
        const TICKER_SHOTS = OPENING_SHOTS.map((shot) => {
          const name = shot.href.replace(/\.webp$/, "");

          return {
            ...shot,
            srcset: [400, 600, 800, 1200]
              .map((width) => `${name}-${width}.webp ${width}w`)
              .concat(`${shot.href} 1600w`)
              .join(", "),
            sizes: "(min-width: 768px) 55vh, 35vh",
          };
        });
        const PRELOADS = {
          "/": TICKER_SHOTS,
          "/projects": OPENING_SHOTS,
          "/about": [
            {
              href: "/images/portrait-1200.webp",
              srcset: [800, 1200, 1600, 2000]
                .map((width) => `/images/portrait-${width}.webp ${width}w`)
                .join(", "),
              sizes: "(min-width: 768px) 140vh, 80vh",
            },
          ],
          "/contact": [
            {
              href: "/images/headshot-160.webp",
              srcset: [80, 160, 240]
                .map((width) => `/images/headshot-${width}.webp ${width}w`)
                .join(", "),
              sizes: "(min-width: 1024px) 72px, (min-width: 768px) 64px, 52px",
            },
          ],
        };
        const path = location.pathname.replace(/\/+$/, "") || "/";

        for (const { href, media, srcset, sizes } of PRELOADS[path] ?? []) {
          const link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.href = href;
          link.setAttribute("fetchpriority", "high");
          if (media) link.media = media;
          if (srcset) link.setAttribute("imagesrcset", srcset);
          if (sizes) link.setAttribute("imagesizes", sizes);
          document.head.append(link);
        }
      }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <title>Richard Han — Full Stack Developer</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
